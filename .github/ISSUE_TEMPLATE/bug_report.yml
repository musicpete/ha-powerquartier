name: Bug report
description: Something does not work as described
body:
  - type: markdown
    attributes:
      value: |
        **Privacy:** never post passwords, tokens, customer, contract, meter or
        invoice numbers, addresses or real consumption data. Replace them with
        placeholders. Security problems: see SECURITY.md, not a public issue.
  - type: input
    id: version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines (redacted)
      render: text
